name: Test commit action (covers csm_app_id and csm_app_private_key inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/tfaction-root.yaml
          TFACTION_WORKING_DIR: tests/fixtures/working-dirs/myapp/dev
          TFACTION_JOB_TYPE: terraform
          TFACTION_IS_APPLY: "false"
        with:
          action: commit
          csm_app_id: "12345"
          csm_app_private_key: "fake-private-key-for-testing"

      - name: Assert action ran (commit may fail on sentinel repo or invalid app key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: commit action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or invalid credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
