name: Test apply-label action with skipped result
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: apply-label
          result: skipped
          pr_number: "1"
      - name: Assert apply-label succeeded with skipped result
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when result=skipped (no API calls made), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: apply-label correctly handled result=skipped without making API calls"
