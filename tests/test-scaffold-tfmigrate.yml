name: Test scaffold-tfmigrate action (migration_name input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: scaffold-tfmigrate
          migration_name: test-migration-2024
          pr_number: "10"
      - name: Assert action ran (scaffold-tfmigrate with migration_name input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scaffold-tfmigrate action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
