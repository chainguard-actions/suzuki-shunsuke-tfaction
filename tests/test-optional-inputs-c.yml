name: Test optional inputs group C
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: scaffold-tfmigrate
          migration_name: my-migration
          module_path: modules/my-module
          pr_number: "10"
          version: "1.0.0"
      - name: Assert action ran
        run: |
          echo "action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run"
            exit 1
          fi
          echo "PASS: action was invoked"
