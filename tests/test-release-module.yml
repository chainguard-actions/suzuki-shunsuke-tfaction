name: Test release-module action (covers module_path and version inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/tfaction-root.yaml
          TFACTION_WORKING_DIR: tests/fixtures/working-dirs/myapp/dev
          TFACTION_JOB_TYPE: terraform
          TFACTION_IS_APPLY: "false"
        with:
          action: release-module
          module_path: modules/mymodule
          version: v1.2.3

      - name: Assert action ran (release-module may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release-module action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
