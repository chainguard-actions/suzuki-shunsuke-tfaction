name: Test generate-config-out action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: generate-config-out
          branch: feature-branch
          file: tfaction.yaml
      - name: Assert action ran
        run: |
          echo "Action completed (may fail due to missing config, but inputs were accepted)"
          echo "PASS"
