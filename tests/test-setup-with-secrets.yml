name: Test setup action with secrets inputs (covers secrets, aws_secrets, github_token_for_github_provider)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/tfaction-root.yaml
          TFACTION_WORKING_DIR: tests/fixtures/working-dirs/myapp/dev
          TFACTION_JOB_TYPE: terraform
          TFACTION_IS_APPLY: "false"
        with:
          action: setup
          secrets: '{"MY_SECRET":"secret-value","DB_PASSWORD":"db-pass"}'
          aws_secrets: '{"AWS_ACCESS_KEY_ID":"fake-key","AWS_SECRET_ACCESS_KEY":"fake-secret"}'
          github_token_for_github_provider: ${{ github.token }}

      - name: Assert action ran (setup may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: setup action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
