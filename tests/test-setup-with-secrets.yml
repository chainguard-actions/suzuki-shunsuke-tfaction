name: Test setup action with secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: setup
          secrets: '{"MY_SECRET":"my-secret-value"}'
          aws_secrets: '{"AWS_ACCESS_KEY_ID":"fake-key"}'
          github_token_for_github_provider: ${{ github.token }}
      - name: Assert action was invoked with secrets, aws_secrets, and github_token_for_github_provider inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with secrets, aws_secrets, and github_token_for_github_provider inputs"
