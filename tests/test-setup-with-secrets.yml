name: Test setup action with secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: setup
          github_token_for_github_provider: ${{ github.token }}
          secrets: '{"MY_SECRET":"my-value"}'
          aws_secrets: '{"AWS_ACCESS_KEY_ID":"fake-key"}'
      - name: Assert action ran (setup with secrets, aws_secrets, and github_token_for_github_provider inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
