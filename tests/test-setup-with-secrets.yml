name: Test setup action with secrets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      TFACTION_CONFIG: ${{ github.workspace }}/tests/tfaction-root.yaml
      TFACTION_WORKING_DIR: tests/foo
      TFACTION_JOB_TYPE: terraform
      TFACTION_IS_APPLY: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: setup
          secrets: "{}"
          aws_secrets: "{}"
          github_token_for_github_provider: "dummy-token"
        continue-on-error: true

      - name: Assert action was invoked (setup may fail without full env)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (not be skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with secrets, aws_secrets, and github_token_for_github_provider inputs"
