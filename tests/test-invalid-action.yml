name: Test invalid action name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: invalid-action-name-that-does-not-exist
      - name: Assert action failed with unknown action error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unknown action name, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown action name"
