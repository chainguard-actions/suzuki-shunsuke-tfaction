name: Test get-target-config action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: get-target-config
          github_token: ${{ github.token }}
          github_token_for_github_provider: dummy-token
          secrets: '{"MY_SECRET":"dummy-value"}'
          aws_secrets: '{"AWS_SECRET_KEY":"dummy-aws-value"}'
      - name: Assert action ran
        run: |
          echo "Action completed (may fail due to missing config, but inputs were accepted)"
          echo "PASS"
