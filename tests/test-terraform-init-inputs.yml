name: Test terraform-init action with secrets, aws_secrets, and github_token_for_github_provider inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: terraform-init
          secrets: "{}"
          aws_secrets: "{}"
          github_token_for_github_provider: ${{ github.token }}
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/get-target-config/tfaction-root.yaml
          TFACTION_JOB_TYPE: terraform
          TFACTION_WORKING_DIR: tests/fixtures/get-target-config/aws/foo/dev
          TFACTION_TARGET: aws/foo/dev
          TFACTION_IS_APPLY: "false"
        continue-on-error: true

      # terraform-init requires terraform to be installed and a valid working directory.
      # It will fail in this test environment, but the inputs must be accepted.
      - name: Assert action was invoked with secrets, aws_secrets, and github_token_for_github_provider inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with secrets, aws_secrets, github_token_for_github_provider inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
