name: Test commit action with CSM inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: commit
          csm_app_id: "123456"
          csm_client_id: "Iv1.abc123def456"
          csm_app_private_key: "fake-private-key-for-coverage"
          csm_aws_kms_key_id: "arn:aws:kms:us-east-1:123456789012:key/test-key-id"
          csm_aws_region: "us-east-1"
          csm_aws_role_to_assume: "arn:aws:iam::123456789012:role/test-role"
      - name: Assert action ran (commit with CSM inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or invalid credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
