name: Test output-github-secrets action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/tfaction-root.yaml
          TFACTION_WORKING_DIR: tests/fixtures/working-dirs/aws/dev
          TFACTION_JOB_TYPE: terraform
          TFACTION_IS_APPLY: "false"
        with:
          action: output-github-secrets
          # Provide an empty JSON object as github_secrets since no secrets are configured
          github_secrets: "{}"

      - name: Assert secrets output is set
        env:
          SECRETS_OUTPUT: ${{ steps.action.outputs.secrets }}
        run: |
          echo "secrets output: $SECRETS_OUTPUT"
          if [ -z "$SECRETS_OUTPUT" ]; then
            echo "FAIL: secrets output is empty"
            exit 1
          fi
          echo "PASS: secrets output is set to '$SECRETS_OUTPUT'"
