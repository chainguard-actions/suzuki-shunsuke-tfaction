name: Test output-github-secrets action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      # tfaction env vars
      TFACTION_CONFIG: ${{ github.workspace }}/tests/tfaction-root.yaml
      TFACTION_WORKING_DIR: tests/foo
      TFACTION_JOB_TYPE: terraform
      TFACTION_IS_APPLY: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: output-github-secrets
          github_secrets: "{}"

      - name: Assert secrets output is empty JSON object
        env:
          ACTUAL: ${{ steps.action.outputs.secrets }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "{}" ]; then
            echo "FAIL: expected '{}' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
