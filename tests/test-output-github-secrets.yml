name: Test output-github-secrets action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create tfaction config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/aws/dev/myapp"
          cat > "$GITHUB_WORKSPACE/tfaction-root.yaml" <<'EOF'
          plan_workflow_name: plan
          target_groups:
            - working_directory: "tests/fixtures/aws/dev/**"
              aws_region: us-east-1
          tflint:
            enabled: false
            fix: false
          trivy:
            enabled: false
          terraform_command: terraform
          working_directory_file: tfaction.yaml
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/aws/dev/myapp/tfaction.yaml" <<'EOF'
          {}
          EOF

      - id: action
        uses: .
        with:
          action: output-github-secrets
          github_secrets: '{"MY_SECRET":"secret-value"}'
        env:
          TFACTION_CONFIG: tfaction-root.yaml
          TFACTION_WORKING_DIR: tests/fixtures/aws/dev/myapp
          TFACTION_JOB_TYPE: terraform
          TFACTION_IS_APPLY: "false"

      - name: Assert secrets output is empty JSON object (no secrets config on target)
        env:
          ACTUAL: ${{ steps.action.outputs.secrets }}
        run: |
          echo "actual: $ACTUAL"
          # When no secrets are configured on the target group, output should be empty JSON
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ "$NORM" = "{}" ] || [ -z "$NORM" ]; then
            echo "PASS: secrets output is empty as expected (no secrets config)"
          else
            echo "FAIL: expected empty secrets output, got: $ACTUAL"
            exit 1
          fi
