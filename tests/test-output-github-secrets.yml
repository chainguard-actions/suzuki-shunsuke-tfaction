name: Test output-github-secrets action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: output-github-secrets
          github_secrets: "{}"
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/output-github-secrets/tfaction-root.yaml
          TFACTION_JOB_TYPE: terraform
          TFACTION_WORKING_DIR: tests/fixtures/output-github-secrets/aws/foo/dev
          TFACTION_IS_APPLY: "false"

      - name: Assert secrets output is empty JSON object
        env:
          ACTUAL: ${{ steps.action.outputs.secrets }}
        run: |
          echo "actual secrets: $ACTUAL"
          # When no secrets are configured, the output should be an empty JSON object
          NORM="$(echo "$ACTUAL" | tr -d '[:space:]')"
          if [ "$NORM" = "{}" ] || [ -z "$NORM" ]; then
            echo "PASS: secrets output is empty as expected"
          else
            echo "FAIL: expected empty secrets output, got '$ACTUAL'"
            exit 1
          fi
