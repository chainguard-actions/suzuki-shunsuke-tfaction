name: Test output-github-secrets action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/tfaction-root.yaml
          TFACTION_WORKING_DIR: tests/fixtures/working-dirs/myapp/dev
          TFACTION_JOB_TYPE: terraform
          TFACTION_IS_APPLY: "false"
        with:
          action: output-github-secrets
          # Provide a JSON map of available secrets
          github_secrets: '{"MY_SECRET":"secret-value","OTHER_SECRET":"other-value"}'

      - name: Assert secrets output is set
        env:
          SECRETS_OUT: ${{ steps.action.outputs.secrets }}
        run: |
          echo "secrets output: $SECRETS_OUT"
          if [ -z "$SECRETS_OUT" ]; then
            echo "FAIL: expected secrets output to be set (at minimum an empty JSON object)"
            exit 1
          fi
          echo "PASS: secrets output is set: '$SECRETS_OUT'"

      - name: Assert secrets output is valid JSON
        env:
          SECRETS_OUT: ${{ steps.action.outputs.secrets }}
        run: |
          echo "Validating JSON: $SECRETS_OUT"
          if ! echo "$SECRETS_OUT" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
            echo "FAIL: secrets output is not valid JSON: '$SECRETS_OUT'"
            exit 1
          fi
          echo "PASS: secrets output is valid JSON"
