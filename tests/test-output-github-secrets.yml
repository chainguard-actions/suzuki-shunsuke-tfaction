name: Test output-github-secrets action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          TFACTION_CONFIG: ${{ github.workspace }}/tests/fixtures/tfaction-root.yaml
          TFACTION_JOB_TYPE: terraform
          TFACTION_WORKING_DIR: tests/fixtures/terraform/dev/us-east-1
        with:
          action: output-github-secrets
          github_secrets: "{}"
      - name: Assert action ran and produced secrets output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SECRETS_OUT: ${{ steps.action.outputs.secrets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "secrets: $SECRETS_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SECRETS_OUT" ]; then
              echo "FAIL: secrets output is empty"
              exit 1
            fi
            echo "PASS: output-github-secrets succeeded with secrets='$SECRETS_OUT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or missing config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
