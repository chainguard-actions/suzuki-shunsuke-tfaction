name: Test hide-comment action with if input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          action: hide-comment
          if: "Comment.HasMeta"
        continue-on-error: true

      # hide-comment requires a PR context (pr number from github.context.issue.number).
      # Under workflow_dispatch there is no PR, so the action is expected to fail.
      # The important thing is that the 'if' input was accepted and the action was invoked.
      - name: Assert action was invoked (failure expected due to no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR number in workflow_dispatch context.
          # Either failure or success is acceptable — we just need the input to be covered.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with 'if' input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
